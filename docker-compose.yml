# PostgreSQL cho môi trường dev. Đổi cổng trên máy riêng bằng docker-compose.override.yml
# (xem docker-compose.override.example.yml).
name: quanlykho

services:
  db:
    image: postgres:17-alpine
    container_name: quanlykho-db
    environment:
      POSTGRES_DB: quanlykho
      POSTGRES_USER: quanlykho
      POSTGRES_PASSWORD: quanlykho_dev # chỉ dùng cho dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanlykho -d quanlykho"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
