name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore quanlykho.slnx
      - run: dotnet build quanlykho.slnx -c Release --no-restore
      - run: dotnet test quanlykho.slnx -c Release --no-build
